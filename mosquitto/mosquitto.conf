# Broker MQTT giữa Frigate và module.
#
# Có mật khẩu từ tuần 3. Tài khoản đặt trong .env (MQTT_USER / MQTT_PASS); lúc khởi
# động, container tự tạo /mosquitto/config/passwd từ 2 biến đó (xem docker-compose.yml),
# nên repo không chứa mật khẩu lẫn file băm.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
