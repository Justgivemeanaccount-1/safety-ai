# Broker MQTT giữa Frigate và module.
# Tuần 1–2: cho kết nối không mật khẩu, vì cổng 1883 chỉ mở cho localhost và mạng Docker.
# Tuần 3 (Uy): thêm password_file trước khi chạy trên mạng thật.

listener 1883
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
